name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholder only — no real database or AI keys are needed in CI.
      DATABASE_URL: mongodb://localhost:27017/examace
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Full API flow against a real in-memory MongoDB replica set
      - run: npm run test:integration
      - run: npm run build
